<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zzorba Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ... (your existing CSS) ... */

        :root {
            --primary-color: #4f46e5;
            --secondary-color: #6366f1;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --dark-bg: #1e293b;
            --light-bg: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--light-bg);
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* Loading Spinner */
        .loader {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
        }

        .loader.active {
            display: block;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 2rem 0;
            box-shadow: var(--shadow-lg);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo i {
            font-size: 2.5rem;
        }

        .auth-status {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Grid Layout */
        .grid {
            display: grid;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .grid-2 {
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 2rem;
            transition: all 0.3s ease;
        }

        .card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-title i {
            color: var(--primary-color);
        }

        /* Forms */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .form-control:required {
            border-left: 4px solid var(--primary-color);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        /* Buttons */
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--secondary-color);
        }

        .btn-success {
            background: var(--success-color);
            color: white;
        }

        .btn-warning {
            background: var(--warning-color);
            color: white;
        }

        .btn-danger {
            background: var(--danger-color);
            color: white;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
        }

        .btn-outline:hover {
            background: var(--primary-color);
            color: white;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        /* Tables */
        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table th,
        .table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .table th {
            background: var(--light-bg);
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-size: 0.875rem;
        }

        .table tr:hover {
            background: var(--light-bg);
        }

        /* Status Badges */
        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .badge-success {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-warning {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-danger {
            background: #fee2e2;
            color: #991b1b;
        }

        /* Submissions Display */
        .submission-card {
            background: var(--light-bg);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border: 1px solid var(--border-color);
        }

        .submission-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .submission-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
        }

        .detail-value {
            font-weight: 500;
        }

        /* Pre formatted code */
        .code-block {
            background: var(--dark-bg);
            color: #e2e8f0;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
        }

        /* Alerts */
        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .alert-info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 1rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .btn-group {
                flex-direction: column;
            }

            .table {
                font-size: 0.875rem;
            }
        }
    </style>
</head>

<body>
    <!-- Loader -->
    <div class="loader" id="loader">
        <div class="spinner"></div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-chart-line"></i>
                <span>Zzorba Admin Dashboard</span>
            </div>
            <div style="display: flex; align-items: center; gap: 1rem;">
                <div class="auth-status" id="authStatus">
                    <i class="fas fa-user-shield"></i>
                    <span id="authText">Not Authenticated</span>
                </div>
                <button onclick="adminLogout()" class="btn btn-outline" style="color: white; border-color: white;">
                    <i class="fas fa-sign-out-alt"></i>
                    Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <!-- Alerts Container -->
        <div id="alertContainer"></div>

        <!-- Authentication Section -->
        <div class="card" id="authSection">
            <div class="card-header">
                <h2 class="card-title">
                    <i class="fas fa-lock"></i>
                    Admin Authentication
                </h2>
            </div>
            <form id="authForm">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="adminEmail" class="form-control" placeholder="admin@example.com"
                            required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" id="adminPassword" class="form-control" placeholder="Enter password"
                            required>
                    </div>
                </div>
                <div class="btn-group">
                    <button type="button" onclick="adminSignup()" class="btn btn-outline">
                        <i class="fas fa-user-plus"></i>
                        Create Admin Account
                    </button>
                    <button type="button" onclick="adminLogin()" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt"></i>
                        Login
                    </button>
                </div>
            </form>
        </div>

        <!-- Dashboard Grid -->
        <div id="dashboard" style="display: none;">
            <div class="grid grid-2">
                <!-- Users Management -->
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">
                            <i class="fas fa-users"></i>
                            User Management
                        </h2>
                        <button onclick="listUsers()" class="btn btn-primary">
                            <i class="fas fa-sync"></i>
                            Refresh
                        </button>
                    </div>
                    <div id="usersContent">
                        <div class="table-container">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Email</th>
                                        <th>Name</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="usersTable">
                                    <tr>
                                        <td colspan="4" style="text-align: center; color: var(--text-secondary);">
                                            Click refresh to load users
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Quick Stats -->
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">
                            <i class="fas fa-chart-bar"></i>
                            Quick Stats
                        </h2>
                    </div>
                    <div id="statsContent">
                        <div class="detail-item">
                            <span class="detail-label">Total Users</span>
                            <span class="detail-value" id="totalUsers">0</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Approved Users</span>
                            <span class="detail-value" id="approvedUsers">0</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Total Submissions</span>
                            <span class="detail-value" id="totalSubmissions">0</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Submissions Section -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">
                        <i class="fas fa-file-alt"></i>
                        Submissions
                    </h2>
                    <div class="btn-group">
                        <button onclick="listSubs()" class="btn btn-primary">
                            <i class="fas fa-sync"></i>
                            Refresh
                        </button>
                        <button onclick="showExportModal()" class="btn btn-success">
                            <i class="fas fa-download"></i>
                            Export to Excel
                        </button>
                    </div>
                </div>
                <div id="submissionsContent">
                    <p style="text-align: center; color: var(--text-secondary);">
                        Click refresh to load submissions
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Export Modal -->
    <div class="modal" id="exportModal">
        <div class="modal-content">
            <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                <h2 class="card-title">
                    <i class="fas fa-file-excel"></i>
                    Export Options
                </h2>
                <button onclick="closeModal()" class="btn btn-danger" style="width: auto; padding: 0.5rem 1rem;">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="exportForm">
                <div class="form-group">
                    <label class="form-label">From Date</label>
                    <input type="date" id="exportFrom" class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">To Date</label>
                    <input type="date" id="exportTo" class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">User Email (optional)</label>
                    <input type="email" id="exportUserEmail" class="form-control" placeholder="Filter by user email">
                </div>
                <div class="btn-group">
                    <button type="button" onclick="exportXls()" class="btn btn-success">
                        <i class="fas fa-download"></i>
                        Download Excel
                    </button>
                    <button type="button" onclick="closeModal()" class="btn btn-outline">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let adminToken = localStorage.getItem('adminToken') || '';
        let users = [];
        let submissions = [];

        // 🔧 Base API URL for Docker network communication
        const API_BASE = "https://zzorba-backend.onrender.com";

        // Set default dates for export modal (today)
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('exportFrom').value = today;
            document.getElementById('exportTo').value = today;

            // Initialize dashboard if token exists
            if (adminToken) showDashboard();
        });

        function showLoader() {
            document.getElementById('loader').classList.add('active');
        }

        function hideLoader() {
            document.getElementById('loader').classList.remove('active');
        }

        function showAlert(message, type = 'info') {
            const alertContainer = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.innerHTML = `
            <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
            <span>${message}</span>
        `;
            alertContainer.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }

        function showDashboard() {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('authText').textContent = 'Authenticated';
            document.getElementById('authStatus').style.background = 'rgba(16, 185, 129, 0.2)';
            listUsers();
            listSubs();
        }

        function adminLogout() {
            adminToken = '';
            localStorage.removeItem('adminToken');
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('authText').textContent = 'Not Authenticated';
            document.getElementById('authStatus').style.background = 'rgba(255, 255, 255, 0.1)';
            showAlert('Logged out successfully!', 'info');
        }

        async function adminSignup() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            if (!email || !password) return showAlert('Please enter email and password', 'error');

            showLoader();
            try {
                const res = await fetch(`${API_BASE}/admin/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (!res.ok) {
                    const errorDetails = await res.text();
                    console.error('Signup API Error:', res.status, errorDetails);
                    showAlert(`Signup failed: ${errorDetails || res.statusText}`, 'error');
                    hideLoader();
                    return;
                }

                const data = await res.json();
                if (data.ok) {
                    showAlert('Admin account created successfully! Please login.', 'success');
                } else {
                    showAlert(data.error || 'Signup failed', 'error');
                }
            } catch (error) {
                showAlert('Network error: ' + error.message, 'error');
            }
            hideLoader();
        }

        async function adminLogin() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            if (!email || !password) return showAlert('Please enter email and password', 'error');

            showLoader();
            try {
                const res = await fetch(`${API_BASE}/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (!res.ok) {
                    if (res.status === 401 || res.status === 403)
                        showAlert('Login failed: Invalid credentials.', 'error');
                    else {
                        const errorDetails = await res.text();
                        console.error('Login API Error:', res.status, errorDetails);
                        showAlert(`Login failed: ${errorDetails || res.statusText}`, 'error');
                    }
                    hideLoader();
                    return;
                }

                const data = await res.json();
                if (data.token) {
                    adminToken = data.token;
                    localStorage.setItem('adminToken', adminToken);
                    showAlert('Login successful!', 'success');
                    showDashboard();
                } else {
                    showAlert(data.error || 'Login failed', 'error');
                }
            } catch (error) {
                showAlert('Network error: ' + error.message, 'error');
            }
            hideLoader();
        }

        async function listUsers() {
            if (!adminToken) return showAlert('Please login first', 'error');

            showLoader();
            try {
                const res = await fetch(`${API_BASE}/admin/users`, {
                    headers: { 'Authorization': 'Bearer ' + adminToken }
                });

                if (!res.ok) {
                    const errorDetails = await res.text();
                    console.error('List Users API Error:', res.status, errorDetails);
                    adminLogout();
                    showAlert(`Failed to load users: ${errorDetails || res.statusText}`, 'error');
                    hideLoader();
                    return;
                }

                users = await res.json();
                const tbody = document.getElementById('usersTable');
                tbody.innerHTML = '';

                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No users found</td></tr>';
                } else {
                    users.forEach(user => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                        <td>${user.email}</td>
                        <td>${user.name || 'N/A'}</td>
                        <td>
                            <span class="badge ${user.approved ? 'badge-success' : 'badge-warning'}">
                                ${user.approved ? 'Approved' : 'Pending'}
                            </span>
                        </td>
                        <td>
                            ${!user.approved ? `<button onclick="approve('${user.email}')" class="btn btn-success">
                                <i class="fas fa-check"></i> Approve
                            </button>` : '<span style="color: var(--text-secondary);">Approved</span>'}
                        </td>
                    `;
                        tbody.appendChild(tr);
                    });
                }

                document.getElementById('totalUsers').textContent = users.length;
                document.getElementById('approvedUsers').textContent = users.filter(u => u.approved).length;
            } catch (error) {
                showAlert('Failed to load users: ' + error.message, 'error');
            }
            hideLoader();
        }

        async function approve(email) {
            if (!adminToken) return showAlert('Please login first', 'error');

            showLoader();
            try {
                const res = await fetch(`${API_BASE}/admin/grant`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + adminToken
                    },
                    body: JSON.stringify({ userEmail: email })
                });

                if (!res.ok) {
                    const errorDetails = await res.text();
                    console.error('Approve API Error:', res.status, errorDetails);
                    adminLogout();
                    showAlert(`Approval failed: ${errorDetails || res.statusText}`, 'error');
                    hideLoader();
                    return;
                }

                const data = await res.json();
                if (data.ok) {
                    showAlert(`User ${email} approved successfully!`, 'success');
                    listUsers();
                } else {
                    showAlert(data.error || 'Approval failed', 'error');
                }
            } catch (error) {
                showAlert('Network error: ' + error.message, 'error');
            }
            hideLoader();
        }

        async function listSubs() {
            if (!adminToken) return showAlert('Please login first', 'error');

            showLoader();
            try {
                const res = await fetch(`${API_BASE}/admin/submissions`, {
                    headers: { 'Authorization': 'Bearer ' + adminToken }
                });

                if (!res.ok) {
                    const errorDetails = await res.text();
                    console.error('List Submissions API Error:', res.status, errorDetails);
                    adminLogout();
                    showAlert(`Failed to load submissions: ${errorDetails || res.statusText}`, 'error');
                    hideLoader();
                    return;
                }

                submissions = await res.json();
                const content = document.getElementById('submissionsContent');
                content.innerHTML = '';

                if (submissions.length === 0) {
                    content.innerHTML = '<p style="text-align:center;color:var(--text-secondary);">No submissions found</p>';
                } else {
                    submissions.forEach(sub => {
                        const card = document.createElement('div');
                        card.className = 'submission-card';

                        const eligibility = sub.eligibility || {};
                        const payload = sub.payload || {};
                        const eligibilityStatus = eligibility.ok ? 'Eligible' : 'Not Eligible';

                        card.innerHTML = `
                        <div class="submission-header">
                            <div>
                                <strong>${sub.user_email || 'Unknown User'}</strong>
                                <span class="badge ${eligibility.ok ? 'badge-success' : 'badge-danger'}">
                                    ${eligibilityStatus}
                                </span>
                            </div>
                            <span style="color: var(--text-secondary); font-size: 0.875rem;">
                                ${new Date(sub.created_at).toLocaleString()}
                            </span>
                        </div>
                        <div class="submission-details">
                            <div class="detail-item"><span class="detail-label">Customer Type</span><span class="detail-value">${payload.customerType || 'N/A'}</span></div>
                            <div class="detail-item"><span class="detail-label">Salary/Turnover</span><span class="detail-value">₹${payload.salary || payload.turnover || 0}</span></div>
                            <div class="detail-item"><span class="detail-label">Max FOIR Amount</span><span class="detail-value">₹${eligibility.maxFOIRAmount || 0}</span></div>
                            <div class="detail-item"><span class="detail-label">Max Eligible Loan</span><span class="detail-value">₹${eligibility.maxEligibleLoanAmount || 0}</span></div>
                        </div>
                        <details style="margin-top:1rem;">
                            <summary style="cursor:pointer;color:var(--primary-color);">View Full Details</summary>
                            <pre class="code-block">${JSON.stringify({ payload, eligibility }, null, 2)}</pre>
                        </details>
                    `;
                        content.appendChild(card);
                    });
                }

                document.getElementById('totalSubmissions').textContent = submissions.length;
            } catch (error) {
                showAlert('Failed to load submissions: ' + error.message, 'error');
            }
            hideLoader();
        }

        function showExportModal() {
            document.getElementById('exportModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('exportModal').classList.remove('active');
        }

        async function exportXls() {
            if (!adminToken) return showAlert('Please login first', 'error');

            const params = new URLSearchParams();
            const from = document.getElementById('exportFrom').value;
            const to = document.getElementById('exportTo').value;
            const userEmail = document.getElementById('exportUserEmail').value;
            if (from) params.append('from', from);
            if (to) params.append('to', to);
            if (userEmail) params.append('userEmail', userEmail);

            showLoader();
            try {
                const res = await fetch(`${API_BASE}/admin/export?${params.toString()}`, {
                    headers: { 'Authorization': 'Bearer ' + adminToken }
                });

                if (!res.ok) {
                    const errorDetails = await res.text();
                    console.error('Export API Error:', res.status, errorDetails);
                    adminLogout();
                    showAlert(`Export failed: ${errorDetails || res.statusText}`, 'error');
                    hideLoader();
                    return;
                }

                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `zzorba_submissions_${Date.now()}.xlsx`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
                showAlert('Export downloaded successfully!', 'success');
                closeModal();
            } catch (error) {
                showAlert('Export error: ' + error.message, 'error');
            }
            hideLoader();
        }
    </script>
</body>
