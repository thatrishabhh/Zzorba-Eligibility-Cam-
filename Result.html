<head>

    <!-- Modern Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->

<body>
    <!-- Main Landing Page -->
    <div class="main-container">
        <header class="main-header">
            <div class="logo">
                <img src="logo.png" alt="ZZORBA" />
            </div>
            <nav class="nav-menu">
                <span class="brand-text">ZZORBA Assessment System</span>
            </nav>
        </header>

        <div class="hero-section">
            <h1>CAM Eligibility Assessment</h1>
            <p>View your comprehensive assessment results</p>
            <button id="viewResultsBtn" class="btn-primary">
                <i class="fas fa-chart-bar"></i>
                View Results
            </button>
        </div>
    </div>

    <!-- Professional Modal Popup -->
    <div id="resultsModal" class="modal-overlay">
        <div class="modal-container">
            <!-- Modal Header -->
            <div class="modal-header">
                <div class="modal-title">
                    <i class="fas fa-certificate"></i>
                    <h2>CAM Assessment Results</h2>
                </div>
                <button class="modal-close" id="closeModalBtn">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- Modal Body -->
            <div class="modal-body" id="modalContent">
                <!-- Dynamic content will be inserted here -->
            </div>

            <!-- Modal Footer -->
            <div class="modal-footer">
                <button class="btn-download" onclick="generatePDF()">
                    <i class="fas fa-file-pdf"></i>
                    Download PDF Report
                </button>
                <button class="btn-print" onclick="window.print()">
                    <i class="fas fa-print"></i>
                    Print
                </button>
                <button class="btn-close" onclick="closeModal()">
                    <i class="fas fa-times-circle"></i>
                    Close
                </button>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <p>Generating PDF...</p>
        </div>
    </div>
</body>

    // Modal Management
    class ModalManager {
        constructor() {
            this.modal = document.getElementById('resultsModal');
            this.openBtn = document.getElementById('viewResultsBtn');
            this.closeBtn = document.getElementById('closeModalBtn');
            this.loadingOverlay = document.getElementById('loadingOverlay');

            this.initEventListeners();
        }

        initEventListeners() {
            // Open modal
            this.openBtn.addEventListener('click', () => this.openModal());

            // Close modal
            this.closeBtn.addEventListener('click', () => this.closeModal());

            // Close on background click
            this.modal.addEventListener('click', (e) => {
                if (e.target === this.modal) {
                    this.closeModal();
                }
            });

            // Close on ESC key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && this.modal.classList.contains('active')) {
                    this.closeModal();
                }
            });
        }

        openModal() {
            document.body.style.overflow = 'hidden';
            this.modal.classList.add('active');
            this.loadData();

            // Animate modal entrance
            setTimeout(() => {
                const container = this.modal.querySelector('.modal-container');
                container.style.animation = 'slideUp 0.4s ease';
            }, 10);
        }

        closeModal() {
            document.body.style.overflow = '';
            this.modal.classList.remove('active');
        }

        loadData() {
            // Show loading animation initially
            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
            <div style="text-align: center; padding: 3rem;">
                <div class="spinner"></div>
                <p>Loading results...</p>
            </div>
        `;

            // Simulate loading and then display results
            setTimeout(() => {
                const params = new URLSearchParams(window.location.search);
                const encodedData = params.get('data');

                let applicationData;
                if (encodedData) {
                    try {
                        const dataString = decodeURIComponent(encodedData);
                        applicationData = JSON.parse(dataString);
                    } catch (error) {
                        console.error("Error parsing data:", error);
                        applicationData = this.getSampleData();
                    }
                } else {
                    applicationData = this.getSampleData();
                }

                this.displayResults(applicationData);
            }, 500);
        }

        getSampleData() {
            return {
                custName: "John Doe",
                customerType: "salaried",
                salary: 75000,
                companyCat: "Cat A",
                pfDed: "yes",
                tdsDed: "no",
                kotakSalaryAccount: "no",
                foirAllowed: 50,
                loans: [
                    { type: "Personal Loan", os: 200000, emi: 5000, obligated: "Yes" },
                    { type: "Credit Card", os: 50000, emi: 2000, obligated: "No" }
                ],
                addrDoc: "yes"
            };
        }

        displayResults(data) {
            const results = this.calculateEligibility(data);
            const modalContent = document.getElementById('modalContent');

            modalContent.innerHTML = `
            <!-- Customer Information Section -->
            <div class="result-section">
                <div class="section-icon">
                    <i class="fas fa-user"></i>
                </div>
                <h3 class="section-title">Customer Profile</h3>
                <div class="info-grid">
                    <div class="info-card">
                        <div class="info-label">Name</div>
                        <div class="info-value">${data.custName}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Customer Type</div>
                        <div class="info-value">${data.customerType === 'salaried' ? 'Salaried' : 'Business'}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">${data.customerType === 'salaried' ? 'Monthly Salary' : 'Annual Turnover'}</div>
                        <div class="info-value">₹${data.customerType === 'salaried' ?
                    data.salary.toLocaleString() :
                    data.turnover.toLocaleString()}</div>
                    </div>
                    ${data.customerType === 'salaried' ? `
                        <div class="info-card">
                            <div class="info-label">Company Category</div>
                            <div class="info-value">${data.companyCat}</div>
                        </div>
                    ` : ''}
                </div>
            </div>
            
            <!-- Eligibility Status -->
            <div class="result-section">
                <div class="section-icon">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h3 class="section-title">Eligibility Status</h3>
                <div style="text-align: center; padding: 2rem;">
                    <span class="status-badge ${results.badgeClass}">
                        ${results.primaryProduct}
                    </span>
                    ${results.primaryLenders.length > 0 ? `
                        <div class="lender-grid" style="justify-content: center; margin-top: 1.5rem;">
                            ${results.primaryLenders.map(lender => `
                                <span class="lender-pill">${lender}</span>
                            `).join('')}
                        </div>
                    ` : '<p style="margin-top: 1rem; color: #6b7280;">No eligible lenders found for this profile</p>'}
                </div>
            </div>
            
            <!-- Financial Analysis -->
            <div class="result-section">
                <div class="section-icon">
                    <i class="fas fa-chart-line"></i>
                </div>
                <h3 class="section-title">Financial Analysis</h3>
                <div class="financial-grid">
                    <div class="financial-card">
                        <div class="financial-label">Allowed Monthly</div>
                        <div class="financial-value">₹${Math.round(results.allowedMonthly).toLocaleString()}</div>
                    </div>
                    <div class="financial-card">
                        <div class="financial-label">Total EMI</div>
                        <div class="financial-value">₹${Math.round(results.totalEMI).toLocaleString()}</div>
                    </div>
                    <div class="financial-card">
                        <div class="financial-label">Final Eligibility</div>
                        <div class="financial-value">₹${Math.round(results.finalEligibility).toLocaleString()}</div>
                    </div>
                    <div class="financial-card">
                        <div class="financial-label">Non-Obligated OS</div>
                        <div class="financial-value">₹${Math.round(results.nonObligatedOS).toLocaleString()}</div>
                    </div>
                </div>
            </div>
            
            <!-- Existing Loans -->
            ${data.loans && data.loans.length > 0 ? `
                <div class="result-section">
                    <div class="section-icon">
                        <i class="fas fa-file-invoice-dollar"></i>
                    </div>
                    <h3 class="section-title">Existing Loan Portfolio</h3>
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Loan Type</th>
                                <th>Outstanding Amount</th>
                                <th>Monthly EMI</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.loans.map(loan => `
                                <tr>
                                    <td>${loan.type}</td>
                                    <td>₹${loan.os.toLocaleString()}</td>
                                    <td>₹${Math.round(loan.emi).toLocaleString()}</td>
                                    <td>
                                        <span class="status-badge ${loan.obligated === 'Yes' ? 'badge-warning' : 'badge-success'}">
                                            ${loan.obligated === 'Yes' ? 'Obligated' : 'Non-Obligated'}
                                        </span>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            ` : ''}
        `;

            // Store data for PDF generation
            window.currentResultsData = { data, ...results };
        }

        calculateEligibility(data) {
            let eligibilityResults = {};

            if (data.customerType === 'salaried') {
                eligibilityResults.odLimit = getODLimitEligibilitySalaried(
                    data.companyCat, data.salary, data.pfDed, data.tdsDed,
                    data.kotakSalaryAccount === 'yes'
                );
                eligibilityResults.personalLoan = getPersonalLoanEligibilitySalaried(
                    data.companyCat, data.salary, data.pfDed, data.tdsDed
                );
            } else {
                eligibilityResults.businessLoan = getBusinessLoanEligibility(
                    data.turnover, data.gst, data.itr, data.license
                );
                eligibilityResults.odLimit = getBusinessODEligibility(
                    data.turnover, data.gst, data.itr, data.license
                );
            }

            const totalEMI = data.loans.reduce((sum, loan) => sum + (loan.emi || 0), 0);
            const allowedMonthly = (data.customerType === 'salaried') ?
                (data.salary * (data.foirAllowed / 100)) :
                ((data.turnover / 12) * 0.05);
            const finalEligibility = Math.max(0, (allowedMonthly - totalEMI) * 40);
            const nonObligatedOS = data.loans
                .filter(l => l.obligated === 'No')
                .reduce((s, l) => s + (l.os || 0), 0);

            let primaryProduct = 'Not Eligible';
            let primaryLenders = [];
            let badgeClass = 'badge-danger';

            if (data.customerType === 'salaried') {
                if (eligibilityResults.odLimit?.length > 0) {
                    primaryProduct = 'OD Limit Eligible';
                    primaryLenders = eligibilityResults.odLimit;
                    badgeClass = 'badge-info';
                } else if (eligibilityResults.personalLoan?.length > 0) {
                    primaryProduct = 'Personal Loan Eligible';
                    primaryLenders = eligibilityResults.personalLoan;
                    badgeClass = 'badge-success';
                }
            } else {
                if (eligibilityResults.businessLoan?.length > 0) {
                    primaryProduct = 'Business Loan Eligible';
                    primaryLenders = eligibilityResults.businessLoan;
                    badgeClass = 'badge-warning';
                } else if (eligibilityResults.odLimit?.length > 0) {
                    primaryProduct = 'Business OD Eligible';
                    primaryLenders = eligibilityResults.odLimit;
                    badgeClass = 'badge-info';
                }
            }

            return {
                eligibilityResults,
                primaryProduct,
                primaryLenders,
                badgeClass,
                totalEMI,
                allowedMonthly,
                finalEligibility,
                nonObligatedOS
            };
        }
    }

    // PDF Generation
    async function generatePDF() {
        const loadingOverlay = document.getElementById('loadingOverlay');
        loadingOverlay.classList.add('active');

        try {
            const element = document.getElementById('modalContent');
            const canvas = await html2canvas(element, {
                scale: 2,
                logging: false,
                useCORS: true,
                backgroundColor: '#ffffff'
            });

            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({
                orientation: 'portrait',
                unit: 'mm',
                format: 'a4'
            });

            // Add header
            pdf.setFontSize(20);
            pdf.setTextColor(0, 115, 60);
            pdf.text('CAM Assessment Report', 105, 20, { align: 'center' });

            // Add date
            pdf.setFontSize(10);
            pdf.setTextColor(100);
            pdf.text(`Generated: ${new Date().toLocaleDateString()}`, 105, 30, { align: 'center' });

            // Add canvas content
            const imgData = canvas.toDataURL('image/png');
            const imgWidth = 190;
            const imgHeight = (canvas.height * imgWidth) / canvas.width;

            pdf.addImage(imgData, 'PNG', 10, 40, imgWidth, imgHeight);

            // Save PDF
            const fileName = `CAM_Report_${window.currentResultsData.data.custName.replace(/\s+/g, '_')}_${new Date().toISOString().slice(0, 10)}.pdf`;
            pdf.save(fileName);

        } catch (error) {
            console.error('Error generating PDF:', error);
            alert('Error generating PDF. Please try again.');
        } finally {
            loadingOverlay.classList.remove('active');
        }
    }

    // Global functions for button clicks
    window.closeModal = function () {
        modalManager.closeModal();
    }

    // Initialize on page load
    let modalManager;
    document.addEventListener('DOMContentLoaded', () => {
        modalManager = new ModalManager();
    });
</script>
